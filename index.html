<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="page-header">
            <div>
                <p class="eyebrow">Personal finance, made clear</p>
                <h1>Expense Tracker</h1>
                <p class="subtitle">A calmer way to keep an eye on where your money goes.</p>
            </div>
            <div class="date-badge" aria-label="Current date">
                <span class="date-dot"></span>
                <span id="current-date">Today</span>
            </div>
        </header>

        <div class="summary">

            <div class="card income-card">
                <h3>Total Income</h3>
                <p id="total-income">₹0.00</p>
                <span class="card-note">Money in</span>
            </div>

            <div class="card expense-card">
                <h3>Total Expense</h3>
                <p id="total-expense">₹0.00</p>
                <span class="card-note">Money out</span>
            </div>

            <div class="card balance-card">
                <h3>Balance</h3>
                <p id="balance">₹0.00</p>
                <span class="card-note" id="balance-note">Ready to begin</span>
            </div>

        </div>

        <div class="form-section">

            <div class="section-heading">
                <div>
                    <p class="section-kicker">Keep it current</p>
                    <h2>Add Transaction</h2>
                </div>
                <span class="section-mark">+</span>
            </div>

            <form id="expense-form">

                <div class="form-group">
                    <label for="description">Description</label>

                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Food, Bus, Books"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="type">Type</label>

                    <select id="type">

                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>

                    <input
                        type="date"
                        id="date"
                        required
                    >
                </div>

                <button class="primary-button" type="submit">
                    <span>Add Transaction</span>
                    <span aria-hidden="true">&#8594;</span>
                </button>

            </form>

        </div>

        <div class="transactions">

            <div class="transactions-header">
                <div>
                    <p class="section-kicker">Your activity</p>
                    <h2>Transactions</h2>
                </div>
                <label class="filter-label" for="filter-type">
                    <span>Show</span>
                    <select id="filter-type">
                        <option value="all">All</option>
                        <option value="income">Income</option>
                        <option value="expense">Expenses</option>
                    </select>
                </label>
            </div>

            <div id="transaction-list">

                <p class="empty">
                    No transactions yet.
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
